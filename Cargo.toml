[package]
name = "msg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
dirs = "5"
nucleo-matcher = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

ratatui = "0.28"
crossterm = "0.28"

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
global-hotkey = "0.6"

[profile.release]
opt-level = 3
lto = true
