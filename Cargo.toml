[package]
name = "msg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
dirs = "5"
nucleo-matcher = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

ratatui = "0.28"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
